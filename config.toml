[device]
# Name or index of the output device
# Run with --list-devices to see options
name = ""
# e.g. name = "NVidia HDMI 0"
# e.g. name = "PipeWire - Monitor Sink"

[engine]
# Preload all sounds into RAM (recommended for zero-latency)
preload = true
# Sample rate to resample to (0 = use device native rate)
sample_rate = 0
# Channels (1 = mono for radio, 2 = stereo for streaming)
channels = 1

[global]
# Global volume multiplier (0.0 - 1.0)
volume = 0.8
# Auto-mute after N seconds of no activity (0 = disabled)
auto_mute_secs = 0

# Key bindings: key -> sound filename
[keys]
"0" = "sgc-offworld-alarm"
"1" = "cQ.wav"
"2" = "73.wav"
"3" = "thank_you.wav"
"4" = "roger.wav"
"5" = "break.wav"
"6" = "key_click.wav"
"7" = "alert.wav"
"8" = "id.wav"
"9" = "custom1.wav"
[overrides]
# "alert.wav" = 1.0
# "key_click.wav" = 0.5

# Web UI / HTTP API
[web]
enabled = true
host = "0.0.0.0"
port = 8347

# Safety features
[safety]
# Duck volume to this level when ducking (for priority sounds)
duck_level = 0.1
# Time (ms) before volume restores after duck
duck_release_ms = 200
# Auto-mute after N seconds idle (0 = disabled)
auto_mute_secs = 0

# MIDI input
[midi]
enabled = false
# Device name or index ("default" = first available)
device = "default"
# Custom note->key mapping (MIDI note number as string)
# [midi.notes]
# "60" = "1"
# "61" = "2"
# "72" = "m"

# Sound sequences (trigger with --seq NAME)
[sequences]
# "check_in" = ["cQ.wav", "id.wav"]
# "call_sign" = ["alert.wav", "id.wav", "73.wav"]
# "de_key" = ["break.wav", "break.wav"]

# Logging
[log]
# File to append playback log (JSON lines). Empty = no file logging.
file = ""
# Max in-memory entries
maxlen = 500
